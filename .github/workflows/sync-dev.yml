name: Sync dev

# Renovate fusionne directement dans main : on reporte ces commits dans dev
# pour que la prochaine PR dev → main ne parte pas d'une base périmée.
# Échoue (sans rien pousser) en cas de conflit : à résoudre à la main.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Fusionner main dans dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev contient déjà main"; exit 0
          fi
          git merge --no-edit origin/main
          git push origin HEAD:dev
