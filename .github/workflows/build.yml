name: Build

# Test de build sur chaque PR : c'est le contrôle qui autorise Renovate à
# fusionner automatiquement. On construit l'image exactement comme la
# publication (Dockerfile), sans la pousser.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - uses: docker/setup-buildx-action@v4

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: gcyb-doc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test de l'image
        run: |
          docker run -d --name gcyb-ci -p 3000:3000 gcyb-doc:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Language: fr' http://127.0.0.1:3000/ || true)
            [ "$code" = 200 ] && { echo "Site OK ($code)"; exit 0; }
            sleep 2
          done
          docker logs gcyb-ci
          echo "Le site ne répond pas en 200"; exit 1
