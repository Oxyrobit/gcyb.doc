name: Build

# Test de build sur chaque PR : c'est le contrôle qui autorise Renovate à
# fusionner automatiquement. On construit l'image exactement comme la
# publication (Dockerfile), sans la pousser.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: 0.76.2

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - uses: docker/setup-buildx-action@v4

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: gcyb-doc:ci
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_DATE=CI
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan de vulnérabilités de l'image construite. Informatif : il ne bloque
      # pas la PR (pas de --exit-code). Résultat dans le log (tableau
      # CRITICAL/HIGH) et dans l'onglet « Summary » du run (synthèse).
      - name: Cache base Trivy
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/work" \
            "aquasec/trivy:$TRIVY_VERSION" image --quiet --scanners vuln \
              --format json --output /work/trivy.json gcyb-doc:ci
          docker run --rm -v "$PWD:/work" "aquasec/trivy:$TRIVY_VERSION" \
            convert --quiet --format table --severity CRITICAL,HIGH /work/trivy.json
          python3 .github/scripts/trivy-summary.py trivy.json >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test de l'image
        run: |
          docker run -d --name gcyb-ci -p 3000:3000 gcyb-doc:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Language: fr' http://127.0.0.1:3000/ || true)
            if [ "$code" = 200 ]; then
              echo "Site OK ($code)"
              curl -s -H 'Accept-Language: fr' http://127.0.0.1:3000/ | grep -o 'sha-[0-9a-f]\{7\}</a>' \
                || { echo "Version absente du pied de page"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          docker logs gcyb-ci
          echo "Le site ne répond pas en 200"; exit 1
